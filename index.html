<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <img src="background.jpg" alt="background">
    </div>
    <div>
        <h2>This is not a reall online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.<br>You <i>know</i> you want to.</h2>
        <form>
            <fieldset>
                <!-- <legend>Let's do this!</legend> -->
                <h3>let's do this!</h3>
                <label for="firstname">First Name</label>
                <input type="text" name="firstname" id="firstname" placeholder="First Name" required>
                <label for="lastname">Last Name</label>
                <input type="text" name="lastname" id="lastname" placeholder="Last Name" required>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Email" required>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <label for="confirm-password">Confirm Password</label>
                <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
            </fieldset>
        </form>
    </div>
</body>
</html>
